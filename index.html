<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Drift</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IBM Plex Mono', monospace;
            background: #0a0e27;
            color: #e0e6ff;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* HUD */
        #hud {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .hud-panel {
            position: absolute;
            background: rgba(10, 14, 39, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 8px;
            padding: 16px 24px;
            font-size: 14px;
            color: #00ff88;
            letter-spacing: 1px;
        }

        #speed-display {
            bottom: 40px;
            left: 40px;
            font-size: 32px;
            font-weight: bold;
        }

        #time-display {
            top: 40px;
            left: 40px;
        }

        #controls-display {
            bottom: 40px;
            right: 40px;
            font-size: 12px;
            text-align: right;
            color: #7080c0;
        }

        /* Modal */
        #modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 14, 39, 0.95);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            z-index: 1000;
            min-width: 300px;
        }

        #modal h2 {
            color: #00ff88;
            margin-bottom: 24px;
            font-size: 20px;
            letter-spacing: 2px;
        }

        #modal button {
            display: block;
            width: 100%;
            padding: 12px 24px;
            margin: 10px 0;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.4);
            color: #00ff88;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 14px;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        #modal button:hover {
            background: rgba(0, 255, 136, 0.2);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
        }

        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 2px solid rgba(0, 255, 136, 0.3);
            border-top: 2px solid #00ff88;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div id="hud">
        <div class="hud-panel" id="time-display">
            <span id="time-value">00:00</span>
        </div>

        <div class="hud-panel" id="speed-display">
            <div id="speed-value">0</div>
            <div style="font-size: 12px; color: #a0aeff;">KM/H</div>
        </div>

        <div class="hud-panel" id="controls-display">
            <div>W/↑ Accelerate</div>
            <div>A/← Turn Left</div>
            <div>S/↓ Brake</div>
            <div>D/→ Turn Right</div>
        </div>
    </div>

    <div id="modal">
        <h2>NEON DRIFT</h2>
        <p style="color: #a0aeff; margin-bottom: 24px; font-size: 12px;">Select Your Ride</p>
        <button onclick="selectCar('camaro')">2019 Camaro ZL1</button>
        <button onclick="selectCar('hellcat')">2020 Dodge Hellcat</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@r128/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        // Game variables
        let scene, camera, renderer;
        let vehicle;
        let gameTime = 0;
        let keys = {};

        const carModels = {
            camaro: '2019_chevrolet_camaro_zl1.glb',
            hellcat: '2020_dodge_charger_srt_hellcat_daytona_50th.glb'
        };

        function initScene() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a2847);
            scene.fog = new THREE.Fog(0x1a2847, 200, 500);

            // Camera
            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(0, 8, -15);

            // Renderer
            renderer = new THREE.WebGLRenderer({
                canvas: document.getElementById('canvas'),
                antialias: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(100, 100, 50);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            // Terrain
            const terrainGeometry = new THREE.PlaneGeometry(300, 300, 50, 50);
            const terrainMaterial = new THREE.MeshStandardMaterial({
                color: 0x2d5a3d,
                roughness: 0.8
            });
            const terrain = new THREE.Mesh(terrainGeometry, terrainMaterial);
            terrain.rotation.x = -Math.PI / 2;
            terrain.receiveShadow = true;
            scene.add(terrain);

            // Road
            const roadGeometry = new THREE.PlaneGeometry(15, 300);
            const roadMaterial = new THREE.MeshStandardMaterial({
                color: 0x1a1a2e,
                roughness: 0.6
            });
            const road = new THREE.Mesh(roadGeometry, roadMaterial);
            road.rotation.x = -Math.PI / 2;
            road.position.z = 100;
            road.receiveShadow = true;
            scene.add(road);

            // Vehicle (placeholder)
            const vehicleGeometry = new THREE.BoxGeometry(1.5, 1, 2.5);
            const vehicleMaterial = new THREE.MeshStandardMaterial({
                color: 0xff0080,
                metalness: 0.4
            });
            vehicle = new THREE.Mesh(vehicleGeometry, vehicleMaterial);
            vehicle.castShadow = true;
            vehicle.receiveShadow = true;
            vehicle.position.y = 1;
            scene.add(vehicle);

            // Vehicle data
            vehicle.velocity = new THREE.Vector3();
            vehicle.speed = 0;
            vehicle.rotation.order = 'YXZ';

            // Input
            document.addEventListener('keydown', (e) => {
                keys[e.key.toLowerCase()] = true;
                if (e.key === 'ArrowUp') keys['w'] = true;
                if (e.key === 'ArrowLeft') keys['a'] = true;
                if (e.key === 'ArrowDown') keys['s'] = true;
                if (e.key === 'ArrowRight') keys['d'] = true;
            });

            document.addEventListener('keyup', (e) => {
                keys[e.key.toLowerCase()] = false;
                if (e.key === 'ArrowUp') keys['w'] = false;
                if (e.key === 'ArrowLeft') keys['a'] = false;
                if (e.key === 'ArrowDown') keys['s'] = false;
                if (e.key === 'ArrowRight') keys['d'] = false;
            });

            // Resize handler
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function loadModel(modelFile) {
            const url = `https://raw.githubusercontent.com/suprosmith-coder/nix-drift/main/models/${modelFile}`;
            const loader = new THREE.GLTFLoader();

            loader.load(
                url,
                (gltf) => {
                    console.log('Model loaded:', modelFile);
                    const model = gltf.scene;
                    model.position.copy(vehicle.position);
                    model.rotation.y = vehicle.rotation.y;
                    scene.remove(vehicle);
                    scene.add(model);
                    vehicle = model;
                    vehicle.position.y = 1;
                    document.getElementById('modal').classList.add('hidden');
                    animate();
                },
                (progress) => {
                    console.log('Loading:', Math.round((progress.loaded / progress.total) * 100) + '%');
                },
                (error) => {
                    console.error('Load error:', error);
                    alert('Failed to load model. Check console.');
                }
            );
        }

        function selectCar(car) {
            document.getElementById('modal').innerHTML = `
                <h2>LOADING...</h2>
                <div class="spinner"></div>
            `;
            loadModel(carModels[car]);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Controls
            if (keys['w']) vehicle.speed = Math.min(vehicle.speed + 0.02, 0.5);
            if (keys['s']) vehicle.speed = Math.max(vehicle.speed - 0.02, -0.25);
            vehicle.speed *= 0.92;

            if (Math.abs(vehicle.speed) > 0.05) {
                if (keys['a']) vehicle.rotation.y += 0.08;
                if (keys['d']) vehicle.rotation.y -= 0.08;
            }

            // Update position
            vehicle.position.x += Math.sin(vehicle.rotation.y) * vehicle.speed;
            vehicle.position.z += Math.cos(vehicle.rotation.y) * vehicle.speed;
            vehicle.position.y = Math.max(1, vehicle.position.y - 0.01);

            // Camera follow
            const targetX = vehicle.position.x;
            const targetY = vehicle.position.y + 8;
            const targetZ = vehicle.position.z - 15;
            camera.position.lerp(new THREE.Vector3(targetX, targetY, targetZ), 0.1);
            camera.lookAt(vehicle.position.x, vehicle.position.y + 2, vehicle.position.z);

            // Update HUD
            gameTime += 1 / 60;
            const minutes = Math.floor(gameTime / 60);
            const seconds = Math.floor(gameTime % 60);
            document.getElementById('time-value').textContent = 
                `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

            const speedKmh = Math.abs(vehicle.speed * 100);
            document.getElementById('speed-value').textContent = Math.round(speedKmh);

            // Render
            renderer.render(scene, camera);
        }

        // Initialize
        initScene();
    </script>
</body>
</html>
