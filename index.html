<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Drift - Slow Roads Inspired</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0e27;
            color: #e0e6ff;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* HUD Container */
        #hud {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            font-family: 'IBM Plex Mono', monospace;
        }

        /* Speed Indicator - Bottom Left */
        #speed-display {
            position: absolute;
            bottom: 40px;
            left: 40px;
            background: rgba(10, 14, 39, 0.7);
            backdrop-filter: blur(8px);
            padding: 20px 30px;
            border: 1px solid rgba(224, 230, 255, 0.2);
            border-radius: 8px;
            font-size: 32px;
            font-weight: 600;
            letter-spacing: 2px;
            color: #00ff88;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
            min-width: 200px;
        }

        #speed-unit {
            font-size: 14px;
            color: #a0aeff;
            margin-top: 4px;
            letter-spacing: 1px;
        }

        /* Time Display - Top Left */
        #time-display {
            position: absolute;
            top: 40px;
            left: 40px;
            background: rgba(10, 14, 39, 0.7);
            backdrop-filter: blur(8px);
            padding: 16px 24px;
            border: 1px solid rgba(224, 230, 255, 0.2);
            border-radius: 8px;
            font-size: 18px;
            color: #a0aeff;
            letter-spacing: 1px;
        }

        /* Vibe Meter - Top Right */
        #vibe-meter {
            position: absolute;
            top: 40px;
            right: 40px;
            background: rgba(10, 14, 39, 0.7);
            backdrop-filter: blur(8px);
            padding: 16px 24px;
            border: 1px solid rgba(224, 230, 255, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .vibe-bar {
            width: 120px;
            height: 8px;
            background: rgba(224, 230, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .vibe-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #00ff88, #00ccff);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.6);
            border-radius: 4px;
        }

        /* Controls Info - Bottom Right */
        #controls-info {
            position: absolute;
            bottom: 40px;
            right: 40px;
            background: rgba(10, 14, 39, 0.7);
            backdrop-filter: blur(8px);
            padding: 20px 24px;
            border: 1px solid rgba(224, 230, 255, 0.2);
            border-radius: 8px;
            font-size: 12px;
            color: #7080c0;
            line-height: 1.6;
            font-family: 'IBM Plex Mono', monospace;
            text-align: right;
        }

        .control-item {
            margin: 4px 0;
        }

        .control-key {
            color: #00ff88;
            font-weight: 600;
            margin-right: 8px;
        }

        /* Loading Indicator */
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 14, 39, 0.95);
            backdrop-filter: blur(8px);
            padding: 40px 60px;
            border: 1px solid rgba(224, 230, 255, 0.2);
            border-radius: 12px;
            text-align: center;
            z-index: 100;
        }

        #loading h2 {
            color: #00ff88;
            margin-bottom: 16px;
            font-size: 20px;
            letter-spacing: 1px;
        }

        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 2px solid rgba(0, 255, 136, 0.3);
            border-top: 2px solid #00ff88;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Fade in animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hud-element {
            animation: fadeIn 0.6s ease-out forwards;
        }

        #speed-display {
            animation-delay: 0.1s;
        }

        #time-display {
            animation-delay: 0.2s;
        }

        #vibe-meter {
            animation-delay: 0.3s;
        }

        #controls-info {
            animation-delay: 0.4s;
        }

        /* Responsive */
        @media (max-width: 768px) {
            #speed-display, #time-display, #vibe-meter, #controls-info {
                font-size: 12px;
                padding: 12px 16px;
                bottom: 20px;
                right: 20px;
                top: 20px;
                left: 20px;
            }

            #controls-info {
                display: none;
            }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div id="hud">
        <div id="time-display" class="hud-element">
            <span id="time-value">00:00</span>
        </div>

        <div id="vibe-meter" class="hud-element">
            <span>VIBE</span>
            <div class="vibe-bar">
                <div class="vibe-fill" id="vibe-fill"></div>
            </div>
        </div>

        <div id="speed-display" class="hud-element">
            <div id="speed-value">0</div>
            <div id="speed-unit">KM/H</div>
        </div>

        <div id="controls-info" class="hud-element">
            <div class="control-item"><span class="control-key">W/↑</span> Accelerate</div>
            <div class="control-item"><span class="control-key">A/←</span> Turn Left</div>
            <div class="control-item"><span class="control-key">S/↓</span> Brake</div>
            <div class="control-item"><span class="control-key">D/→</span> Turn Right</div>
            <div class="control-item"><span class="control-key">SPACE</span> Handbrake</div>
        </div>
    </div>

    <div id="loading">
        <h2>INITIALIZING</h2>
        <div class="spinner"></div>
    </div>

    <script async src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script type="module">
        import { FBXLoader } from 'https://cdn.jsdelivr.net/npm/three@r128/examples/jsm/loaders/FBXLoader.js';
        import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@r128/examples/jsm/loaders/GLTFLoader.js';

        // ============================================
        // SCENE SETUP
        // ============================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a2847);
        scene.fog = new THREE.Fog(0x1a2847, 200, 500);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFShadowShadowMap;

        // ============================================
        // LIGHTING
        // ============================================
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(100, 100, 50);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.camera.far = 500;
        directionalLight.shadow.camera.left = -150;
        directionalLight.shadow.camera.right = 150;
        directionalLight.shadow.camera.top = 150;
        directionalLight.shadow.camera.bottom = -150;
        scene.add(directionalLight);

        // ============================================
        // VEHICLE PHYSICS (Arcade-style)
        // ============================================
        class Vehicle {
            constructor() {
                this.position = new THREE.Vector3(0, 2, 0);
                this.velocity = new THREE.Vector3(0, 0, 0);
                this.rotation = 0; // Yaw in radians
                this.speed = 0;
                this.maxSpeed = 0.5;
                this.acceleration = 0.02;
                this.friction = 0.92;
                this.turnSpeed = 0.08;

                // Input state
                this.keys = {
                    w: false, a: false, s: false, d: false, space: false
                };

                // Visual mesh (placeholder cube until model loads)
                this.mesh = new THREE.Mesh(
                    new THREE.BoxGeometry(1.5, 1, 2.5),
                    new THREE.MeshStandardMaterial({ color: 0xff0080, metalness: 0.4 })
                );
                this.mesh.castShadow = true;
                this.mesh.receiveShadow = true;
                this.mesh.position.copy(this.position);
                scene.add(this.mesh);
            }

            update() {
                // Acceleration
                if (this.keys.w) this.speed = Math.min(this.speed + this.acceleration, this.maxSpeed);
                if (this.keys.s) this.speed = Math.max(this.speed - this.acceleration, -this.maxSpeed * 0.5);
                
                // Friction
                this.speed *= this.friction;

                // Turning (only when moving)
                if (Math.abs(this.speed) > 0.05) {
                    if (this.keys.a) this.rotation += this.turnSpeed;
                    if (this.keys.d) this.rotation -= this.turnSpeed;
                }

                // Handbrake (sharp friction)
                if (this.keys.space) this.speed *= 0.85;

                // Update position
                this.position.x += Math.sin(this.rotation) * this.speed;
                this.position.z += Math.cos(this.rotation) * this.speed;

                // Gravity
                this.position.y -= 0.01;
                if (this.position.y < 0.5) this.position.y = 0.5;

                // Update mesh
                this.mesh.position.copy(this.position);
                this.mesh.rotation.y = this.rotation;
            }

            loadModel(url, isGLTF = false) {
                const loader = isGLTF ? new GLTFLoader() : new FBXLoader();
                loader.load(url, (data) => {
                    const model = isGLTF ? data.scene : data;
                    model.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                        }
                    });
                    scene.remove(this.mesh);
                    this.mesh = model;
                    this.mesh.position.copy(this.position);
                    this.mesh.rotation.y = this.rotation;
                    scene.add(this.mesh);
                    console.log('Vehicle model loaded');
                });
            }
        }

        const vehicle = new Vehicle();

        // ============================================
        // TERRAIN
        // ============================================
        function createTerrain() {
            const terrainGeometry = new THREE.PlaneGeometry(300, 300, 50, 50);
            const terrainMaterial = new THREE.MeshStandardMaterial({
                color: 0x2d5a3d,
                roughness: 0.8,
                metalness: 0.1
            });

            terrainGeometry.vertices.forEach((v, i) => {
                v.z = Math.sin(v.x * 0.05) * 2 + Math.cos(v.y * 0.05) * 2;
            });
            terrainGeometry.computeVertexNormals();

            const terrain = new THREE.Mesh(terrainGeometry, terrainMaterial);
            terrain.rotation.x = -Math.PI / 2;
            terrain.receiveShadow = true;
            scene.add(terrain);
        }

        function createRoad() {
            const roadGeometry = new THREE.PlaneGeometry(15, 300);
            const roadMaterial = new THREE.MeshStandardMaterial({
                color: 0x1a1a2e,
                roughness: 0.6
            });

            const road = new THREE.Mesh(roadGeometry, roadMaterial);
            road.rotation.x = -Math.PI / 2;
            road.position.z = 100;
            road.receiveShadow = true;
            scene.add(road);
        }

        createTerrain();
        createRoad();

        // ============================================
        // INPUT HANDLING
        // ============================================
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w') vehicle.keys.w = true;
            if (key === 'a') vehicle.keys.a = true;
            if (key === 's') vehicle.keys.s = true;
            if (key === 'd') vehicle.keys.d = true;
            if (e.code === 'Space') { vehicle.keys.space = true; e.preventDefault(); }
            
            // Arrow keys
            if (e.key === 'ArrowUp') vehicle.keys.w = true;
            if (e.key === 'ArrowLeft') vehicle.keys.a = true;
            if (e.key === 'ArrowDown') vehicle.keys.s = true;
            if (e.key === 'ArrowRight') vehicle.keys.d = true;
        });

        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w') vehicle.keys.w = false;
            if (key === 'a') vehicle.keys.a = false;
            if (key === 's') vehicle.keys.s = false;
            if (key === 'd') vehicle.keys.d = false;
            if (e.code === 'Space') vehicle.keys.space = false;
            
            if (e.key === 'ArrowUp') vehicle.keys.w = false;
            if (e.key === 'ArrowLeft') vehicle.keys.a = false;
            if (e.key === 'ArrowDown') vehicle.keys.s = false;
            if (e.key === 'ArrowRight') vehicle.keys.d = false;
        });

        // ============================================
        // GAME STATE
        // ============================================
        let gameTime = 0;
        let vibeMeter = 100;

        function updateHUD() {
            const minutes = Math.floor(gameTime / 60);
            const seconds = Math.floor(gameTime % 60);
            const timeStr = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            document.getElementById('time-value').textContent = timeStr;

            const speedKmh = Math.abs(vehicle.speed * 100);
            document.getElementById('speed-value').textContent = Math.round(speedKmh);

            vibeMeter = Math.max(0, vibeMeter - 0.1);
            if (Math.abs(vehicle.speed) > 0.1) vibeMeter = Math.min(100, vibeMeter + 0.2);
            document.getElementById('vibe-fill').style.width = vibeMeter + '%';
        }

        // ============================================
        // CAMERA FOLLOW
        // ============================================
        const cameraOffset = new THREE.Vector3(0, 8, -15);

        function updateCamera() {
            const targetX = vehicle.position.x + cameraOffset.x;
            const targetY = vehicle.position.y + cameraOffset.y;
            const targetZ = vehicle.position.z + cameraOffset.z;

            camera.position.lerp(new THREE.Vector3(targetX, targetY, targetZ), 0.1);
            camera.lookAt(vehicle.position.x, vehicle.position.y + 2, vehicle.position.z);
        }

        // ============================================
        // ANIMATION LOOP
        // ============================================
        function animate() {
            requestAnimationFrame(animate);

            vehicle.update();
            updateCamera();
            updateHUD();
            gameTime += 1 / 60;

            renderer.render(scene, camera);
        }

        // ============================================
        // MODEL LOADING
        // ============================================
        const availableModels = {
            'Camaro ZL1': '2019_chevrolet_camaro_zl1.glb',
            'Dodge Hellcat': '2020_dodge_charger_srt_hellcat_daytona_50th.glb'
        };

        function createModelSelector() {
            const selector = document.createElement('div');
            selector.id = 'model-selector';
            selector.style.cssText = `
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: rgba(10, 14, 39, 0.95);
                backdrop-filter: blur(8px);
                padding: 40px 60px;
                border: 1px solid rgba(224, 230, 255, 0.2);
                border-radius: 12px;
                text-align: center;
                z-index: 100;
                font-family: 'IBM Plex Mono', monospace;
            `;
            
            const title = document.createElement('h2');
            title.textContent = 'SELECT YOUR RIDE';
            title.style.cssText = 'color: #00ff88; margin-bottom: 24px; font-size: 20px; letter-spacing: 1px;';
            selector.appendChild(title);

            Object.entries(availableModels).forEach(([name, file]) => {
                const btn = document.createElement('button');
                btn.textContent = name;
                btn.style.cssText = `
                    display: block;
                    width: 100%;
                    padding: 12px 24px;
                    margin: 8px 0;
                    background: rgba(0, 255, 136, 0.1);
                    border: 1px solid rgba(0, 255, 136, 0.4);
                    color: #00ff88;
                    border-radius: 6px;
                    cursor: pointer;
                    font-family: 'IBM Plex Mono', monospace;
                    font-size: 14px;
                    letter-spacing: 1px;
                    transition: all 0.3s ease;
                `;
                btn.onmouseover = () => {
                    btn.style.background = 'rgba(0, 255, 136, 0.2)';
                    btn.style.boxShadow = '0 0 15px rgba(0, 255, 136, 0.3)';
                };
                btn.onmouseout = () => {
                    btn.style.background = 'rgba(0, 255, 136, 0.1)';
                    btn.style.boxShadow = 'none';
                };
                btn.onclick = () => {
                    loadAndStartGame(file);
                    selector.remove();
                };
                selector.appendChild(btn);
            });

            document.body.appendChild(selector);
        }

        function loadAndStartGame(modelFile) {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('loading').innerHTML = `
                <h2>LOADING ${modelFile.split('_').slice(0, 3).join(' ').toUpperCase()}</h2>
                <div class="spinner"></div>
            `;

            // GitHub raw content URL
            const modelUrl = `https://raw.githubusercontent.com/suprosmith-coder/nix-drift/main/models/${modelFile}`;
            
            vehicle.loadModel(modelUrl, true); // true = isGLTF

            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
                animate();
            }, 1500);
        }

        // Show selector on load
        document.getElementById('loading').style.display = 'none';
        createModelSelector();

        // ============================================
        // WINDOW RESIZE
        // ============================================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ============================================
        // EXPORT VEHICLE FOR MODEL LOADING
        // ============================================
        window.gameVehicle = vehicle;
        window.gameScene = scene;
        console.log('Game initialized. Load models with:');
        console.log('gameVehicle.loadModel("path/to/model.fbx")');
        console.log('gameVehicle.loadModel("path/to/model.glb", true)');
    </script>
</body>
</html>
