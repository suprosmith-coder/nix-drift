<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
  <title>Neon Drift</title>
  <style>
    :root {
      --bg: #0a0e27;
      --panel: rgba(10,14,39,.75);
      --stroke: rgba(0,255,136,.28);
      --shadow: 0 8px 24px rgba(0,255,136,.1);
      --good: #00ff88;
      --muted: rgba(160,174,255,.85);
    }
    *{-webkit-tap-highlight-color:transparent;touch-action:none;}
    html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:'IBM Plex Mono',ui-monospace,monospace;color:#fff;}
    canvas{display:block;}

    /* HUD */
    #hud{position:fixed;inset:0;pointer-events:none;}
    #topbar{
      position:fixed;left:12px;top:12px;
      display:flex;gap:8px;align-items:center;
      background:var(--panel);border:1px solid var(--stroke);
      padding:8px 12px;border-radius:14px;
      backdrop-filter:blur(6px);box-shadow:var(--shadow);
      font-weight:900;
    }
    .chip{
      padding:5px 10px;border-radius:999px;
      background:rgba(0,255,136,.08);
      border:1px solid rgba(0,255,136,.18);
      font-size:13px;color:var(--good);white-space:nowrap;
    }
    #speedometer{
      position:fixed;left:12px;bottom:160px;
      background:var(--panel);border:1px solid var(--stroke);
      padding:12px 20px;border-radius:14px;
      backdrop-filter:blur(6px);text-align:center;
    }
    #speedVal{font-size:36px;font-weight:900;color:var(--good);line-height:1;text-shadow:0 0 16px rgba(0,255,136,.5);}
    #speedUnit{font-size:11px;color:var(--muted);margin-top:3px;letter-spacing:1px;}

    /* Desktop controls hint - hidden on mobile */
    #controlsHint{
      position:fixed;right:12px;top:12px;
      background:var(--panel);border:1px solid var(--stroke);
      padding:10px 14px;border-radius:14px;
      backdrop-filter:blur(6px);
      font-size:12px;color:var(--muted);line-height:1.7;
    }
    #controlsHint b{color:var(--good);}
    @media(max-width:768px){#controlsHint{display:none;}#speedometer{bottom:180px;}}

    /* Mobile D-Pad Controls */
    #mobileControls{
      position:fixed;bottom:16px;width:100%;
      display:none;
      pointer-events:none;
      z-index:20;
    }
    @media(max-width:768px){#mobileControls{display:flex;justify-content:space-between;align-items:flex-end;padding:0 16px;}}
    .dpad{
      display:grid;
      grid-template-columns:60px 60px 60px;
      grid-template-rows:60px 60px;
      gap:6px;
      pointer-events:auto;
    }
    .dpad-btn{
      display:flex;align-items:center;justify-content:center;
      background:rgba(0,255,136,.1);
      border:1px solid rgba(0,255,136,.3);
      border-radius:14px;
      font-size:22px;
      cursor:pointer;
      user-select:none;
      -webkit-user-select:none;
      transition:background .1s;
      pointer-events:auto;
      touch-action:none;
    }
    .dpad-btn:active,.dpad-btn.pressed{
      background:rgba(0,255,136,.28);
      border-color:var(--good);
      box-shadow:0 0 16px rgba(0,255,136,.3);
    }
    #btnUp   {grid-column:2;grid-row:1;}
    #btnLeft {grid-column:1;grid-row:2;}
    #btnDown {grid-column:2;grid-row:2;}
    #btnRight{grid-column:3;grid-row:2;}

    /* Brake button right side */
    #brakeBtn{
      pointer-events:auto;
      width:70px;height:70px;
      display:flex;align-items:center;justify-content:center;
      background:rgba(255,80,80,.12);
      border:1px solid rgba(255,80,80,.35);
      border-radius:50%;
      font-size:20px;font-weight:900;
      color:#ff6b6b;cursor:pointer;
      user-select:none;-webkit-user-select:none;
      touch-action:none;
      transition:background .1s;
      margin-bottom:10px;
    }
    #brakeBtn:active,#brakeBtn.pressed{
      background:rgba(255,80,80,.28);
      box-shadow:0 0 16px rgba(255,80,80,.3);
    }

    #toast{
      position:fixed;left:50%;bottom:200px;transform:translateX(-50%);
      background:rgba(0,0,0,.6);border:1px solid var(--stroke);
      padding:8px 16px;border-radius:999px;backdrop-filter:blur(6px);
      display:none;font-weight:900;pointer-events:none;
      color:var(--good);font-size:14px;
    }

    /* Overlay */
    #overlay{
      position:fixed;inset:0;
      display:flex;align-items:center;justify-content:center;
      background:radial-gradient(1000px 600px at 50% 35%,rgba(0,255,136,.07),rgba(0,0,0,.85));
      z-index:10;
    }
    .panel{
      width:min(440px,calc(100% - 24px));
      background:rgba(10,14,39,.92);
      border:1px solid rgba(0,255,136,.22);
      border-radius:20px;padding:28px;
      box-shadow:0 18px 60px rgba(0,0,0,.6);
      backdrop-filter:blur(12px);text-align:center;
    }
    .panel h1{margin:0 0 4px;font-size:26px;color:var(--good);letter-spacing:2px;text-shadow:0 0 24px rgba(0,255,136,.4);}
    .panel p{margin:4px 0 16px;opacity:.65;font-size:12px;}
    .car-grid{display:flex;gap:12px;justify-content:center;margin:16px 0 20px;}
    .car-btn{
      flex:1;padding:14px 10px;
      background:rgba(0,255,136,.06);
      border:1px solid rgba(0,255,136,.22);
      color:var(--good);border-radius:14px;
      cursor:pointer;font-family:inherit;
      font-size:12px;font-weight:900;letter-spacing:.5px;
      transition:all .15s;line-height:1.5;
    }
    .car-btn:hover,.car-btn.selected{
      background:rgba(0,255,136,.15);
      border-color:var(--good);
      box-shadow:0 0 18px rgba(0,255,136,.22);
      transform:translateY(-2px);
    }
    .car-btn .icon{font-size:26px;display:block;margin-bottom:6px;}
    .start-btn{
      width:100%;padding:13px;
      background:rgba(0,255,136,.1);
      border:1px solid var(--good);
      color:var(--good);border-radius:12px;
      cursor:pointer;font-family:inherit;
      font-size:15px;font-weight:900;letter-spacing:1px;
      transition:all .15s;
    }
    .start-btn:hover{background:rgba(0,255,136,.2);box-shadow:0 0 24px rgba(0,255,136,.25);}
    .start-btn:disabled{opacity:.5;cursor:not-allowed;}
    #loadingMsg{color:var(--muted);font-size:12px;margin-top:12px;min-height:16px;}
    #errorMsg{color:#ff6b6b;font-size:11px;margin-top:8px;display:none;line-height:1.4;}
    .spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(0,255,136,.2);border-top:2px solid var(--good);border-radius:50%;animation:spin 1s linear infinite;vertical-align:middle;margin-right:6px;}
    @keyframes spin{to{transform:rotate(360deg);}}
  </style>
</head>
<body>

  <!-- HUD -->
  <div id="hud" style="display:none">
    <div id="topbar">
      <div class="chip" id="timeChip">⏱ 00:00</div>
      <div class="chip" id="carChip">🚗 —</div>
    </div>
    <div id="speedometer">
      <div id="speedVal">0</div>
      <div id="speedUnit">KM/H</div>
    </div>
    <div id="controlsHint">
      <b>W/↑</b> Accelerate<br>
      <b>S/↓</b> Brake<br>
      <b>A/←</b> Left &nbsp;<b>D/→</b> Right<br>
      <b>Space</b> Handbrake<br>
      <b>Drag</b> Rotate camera
    </div>
    <div id="toast"></div>

    <!-- Mobile D-Pad -->
    <div id="mobileControls">
      <div class="dpad">
        <div class="dpad-btn" id="btnUp">▲</div>
        <div class="dpad-btn" id="btnLeft">◀</div>
        <div class="dpad-btn" id="btnDown">▼</div>
        <div class="dpad-btn" id="btnRight">▶</div>
      </div>
      <div id="brakeBtn">🔴<br><span style="font-size:10px">BRAKE</span></div>
    </div>
  </div>

  <!-- Menu -->
  <div id="overlay">
    <div class="panel">
      <h1>NEON DRIFT</h1>
      <p>A slow, meditative drive through neon-lit roads</p>
      <div class="car-grid">
        <div class="car-btn selected" id="btn-camaro" onclick="selectCar('camaro',this)">
          <span class="icon">🏎️</span>
          Camaro ZL1<br>
          <span style="font-size:10px;opacity:.5">2019</span>
        </div>
        <div class="car-btn" id="btn-hellcat" onclick="selectCar('hellcat',this)">
          <span class="icon">🐱</span>
          Hellcat Daytona<br>
          <span style="font-size:10px;opacity:.5">2020</span>
        </div>
      </div>
      <button class="start-btn" id="startBtn" onclick="startGame()">START DRIVING</button>
      <div id="loadingMsg"></div>
      <div id="errorMsg"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <script>
  /* ============================================================
     CONFIG
  ============================================================ */
  const MODEL_BASE = 'https://suprosmith-coder.github.io/nix-drift/models/';
  const MODELS = {
    camaro:  '2019_chevrolet_camaro_zl1.glb',
    hellcat: '2020_dodge_charger_srt_hellcat_daytona_50th.glb'
  };
  const CAR_NAMES = { camaro:'Camaro ZL1', hellcat:'Hellcat Daytona' };

  /* ============================================================
     STATE
  ============================================================ */
  let scene, camera, renderer;
  let vehicleMesh = null;
  let gameRunning = false;
  let gameTime = 0;
  let selectedCar = 'camaro';

  const car = {
    speed:0, maxSpeed:0.45, accel:0.018, friction:0.91,
    turnSpeed:0.065, posX:0, posY:1.2, posZ:0, rotY:0
  };

  // Unified input (keyboard + touch)
  const input = { fwd:false, back:false, left:false, right:false, brake:false };

  /* ============================================================
     KEYBOARD INPUT
  ============================================================ */
  document.addEventListener('keydown', e => {
    if(e.code==='KeyW'||e.key==='ArrowUp')    input.fwd   = true;
    if(e.code==='KeyS'||e.key==='ArrowDown')  input.back  = true;
    if(e.code==='KeyA'||e.key==='ArrowLeft')  input.left  = true;
    if(e.code==='KeyD'||e.key==='ArrowRight') input.right = true;
    if(e.code==='Space') { input.brake = true; e.preventDefault(); }
  });
  document.addEventListener('keyup', e => {
    if(e.code==='KeyW'||e.key==='ArrowUp')    input.fwd   = false;
    if(e.code==='KeyS'||e.key==='ArrowDown')  input.back  = false;
    if(e.code==='KeyA'||e.key==='ArrowLeft')  input.left  = false;
    if(e.code==='KeyD'||e.key==='ArrowRight') input.right = false;
    if(e.code==='Space') input.brake = false;
  });

  /* ============================================================
     MOBILE TOUCH INPUT
  ============================================================ */
  function bindBtn(id, inputKey) {
    const el = document.getElementById(id);
    if (!el) return;
    const press = e => { e.preventDefault(); input[inputKey] = true; el.classList.add('pressed'); };
    const release = e => { e.preventDefault(); input[inputKey] = false; el.classList.remove('pressed'); };
    el.addEventListener('touchstart', press, { passive:false });
    el.addEventListener('touchend',   release, { passive:false });
    el.addEventListener('touchcancel',release, { passive:false });
    // Also mouse for testing on desktop
    el.addEventListener('mousedown', press);
    el.addEventListener('mouseup',   release);
    el.addEventListener('mouseleave',release);
  }

  function initMobileControls() {
    bindBtn('btnUp',    'fwd');
    bindBtn('btnDown',  'back');
    bindBtn('btnLeft',  'left');
    bindBtn('btnRight', 'right');
    bindBtn('brakeBtn', 'brake');
  }

  /* ============================================================
     SCENE
  ============================================================ */
  function initScene() {
    renderer = new THREE.WebGLRenderer({ antialias: false }); // antialias off = big perf gain
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5)); // cap pixel ratio
    renderer.shadowMap.enabled = false; // shadows off on mobile = massive perf gain
    document.body.appendChild(renderer.domElement);

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a2847);
    scene.fog = new THREE.FogExp2(0x1a2847, 0.006);

    camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.1, 600);
    camera.position.set(0, 10, -18);

    // Lights (simplified - no shadows)
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const sun = new THREE.DirectionalLight(0xffffff, 0.8);
    sun.position.set(80, 120, 60);
    scene.add(sun);
    scene.add(new THREE.HemisphereLight(0x223366, 0x112211, 0.5));

    buildTerrain();
    buildRoad();
    buildScenery();

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  }

  /* ============================================================
     WORLD BUILDING (optimized - merged geometries, less objects)
  ============================================================ */
  function buildTerrain() {
    // Lower poly terrain - 30x30 instead of 80x80
    const geo = new THREE.PlaneGeometry(600, 600, 30, 30);
    const pos = geo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      if (Math.abs(x) > 14) {
        const z = pos.getY(i);
        pos.setZ(i, Math.sin(x * 0.04) * 3 + Math.cos(z * 0.03) * 2);
      }
    }
    geo.computeVertexNormals();
    const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color:0x2d5a3d, roughness:0.9 }));
    mesh.rotation.x = -Math.PI / 2;
    scene.add(mesh);
  }

  function buildRoad() {
    // Road surface
    const road = new THREE.Mesh(
      new THREE.PlaneGeometry(12, 800),
      new THREE.MeshStandardMaterial({ color:0x1a1a2e, roughness:0.7 })
    );
    road.rotation.x = -Math.PI / 2;
    road.position.set(0, 0.01, 200);
    scene.add(road);

    // Center dashes - merged into one geometry for performance
    const dashGeo = new THREE.BufferGeometry();
    const verts = [];
    for (let z = -400; z < 400; z += 22) {
      // Each dash as 2 triangles
      const hw = 0.12, hl = 4;
      verts.push(
        -hw, 0.02, z,     hw, 0.02, z,     hw, 0.02, z+hl,
        -hw, 0.02, z,     hw, 0.02, z+hl,  -hw, 0.02, z+hl
      );
    }
    dashGeo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
    dashGeo.computeVertexNormals();
    scene.add(new THREE.Mesh(dashGeo, new THREE.MeshStandardMaterial({ color:0xffffff })));

    // Neon edge lines
    const edgeMat = new THREE.MeshStandardMaterial({ color:0x00ff88, emissive:0x00ff88, emissiveIntensity:0.8 });
    [-6, 6].forEach(x => {
      const edge = new THREE.Mesh(
        new THREE.PlaneGeometry(0.15, 800),
        edgeMat
      );
      edge.rotation.x = -Math.PI / 2;
      edge.position.set(x, 0.02, 200);
      scene.add(edge);
    });
  }

  function buildScenery() {
    // Merge all trees into one draw call each for cones and trunks
    const coneMat = new THREE.MeshStandardMaterial({ color:0x1a4a2a });
    const trunkMat = new THREE.MeshStandardMaterial({ color:0x4a2a0a });
    const poleMat = new THREE.MeshStandardMaterial({ color:0x333355 });
    const glowMat = new THREE.MeshStandardMaterial({ color:0x00ccff, emissive:0x00ccff, emissiveIntensity:1 });

    // Use instanced meshes for trees = huge performance win
    const treePositions = [];
    const xs = [-14, -18, -24, 14, 18, 24];
    for (let z = -300; z < 300; z += 20) {
      xs.forEach(x => {
        treePositions.push({
          x: x + (Math.random() - 0.5) * 4,
          z: z + (Math.random() - 0.5) * 4,
          h: 3 + Math.random() * 4
        });
      });
    }

    const coneGeo  = new THREE.ConeGeometry(1.5, 5, 5); // low poly
    const trunkGeo = new THREE.CylinderGeometry(0.2, 0.25, 1.2, 5);
    const instancedCones  = new THREE.InstancedMesh(coneGeo,  coneMat,  treePositions.length);
    const instancedTrunks = new THREE.InstancedMesh(trunkGeo, trunkMat, treePositions.length);

    const dummy = new THREE.Object3D();
    treePositions.forEach((t, i) => {
      dummy.position.set(t.x, t.h / 2, t.z);
      dummy.scale.set(1, t.h / 5, 1);
      dummy.updateMatrix();
      instancedCones.setMatrixAt(i, dummy.matrix);

      dummy.position.set(t.x, 0.6, t.z);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      instancedTrunks.setMatrixAt(i, dummy.matrix);
    });
    scene.add(instancedCones);
    scene.add(instancedTrunks);

    // Street poles (instanced)
    const poleGeo  = new THREE.CylinderGeometry(0.1, 0.12, 5, 5);
    const lightGeo = new THREE.SphereGeometry(0.22, 6, 6);
    const polePositions = [];
    for (let z = -200; z < 400; z += 30) {
      [-9, 9].forEach(x => polePositions.push({ x, z }));
    }

    const instancedPoles  = new THREE.InstancedMesh(poleGeo,  poleMat,  polePositions.length);
    const instancedLights = new THREE.InstancedMesh(lightGeo, glowMat,  polePositions.length);
    polePositions.forEach((p, i) => {
      dummy.position.set(p.x, 2.5, p.z);
      dummy.scale.set(1,1,1);
      dummy.updateMatrix();
      instancedPoles.setMatrixAt(i, dummy.matrix);

      dummy.position.set(p.x, 5.2, p.z);
      dummy.updateMatrix();
      instancedLights.setMatrixAt(i, dummy.matrix);
    });
    scene.add(instancedPoles);
    scene.add(instancedLights);

    // Stars
    const starsGeo = new THREE.BufferGeometry();
    const starsArr = [];
    for (let i = 0; i < 1000; i++) { // halved from 2000
      starsArr.push(
        (Math.random() - 0.5) * 800,
        60 + Math.random() * 150,
        (Math.random() - 0.5) * 800
      );
    }
    starsGeo.setAttribute('position', new THREE.Float32BufferAttribute(starsArr, 3));
    scene.add(new THREE.Points(starsGeo, new THREE.PointsMaterial({ color:0xffffff, size:0.6 })));
  }

  /* ============================================================
     MODEL LOADING
  ============================================================ */
  function loadCarModel(carKey, onDone, onError) {
    const loader = new THREE.GLTFLoader();
    const url = MODEL_BASE + MODELS[carKey];
    document.getElementById('loadingMsg').innerHTML = `<span class="spinner"></span>Loading ${CAR_NAMES[carKey]}...`;
    document.getElementById('errorMsg').style.display = 'none';

    loader.load(url,
      gltf => {
        const model = gltf.scene;
        // Auto scale
        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const scale = 4.5 / Math.max(size.x, size.y, size.z);
        model.scale.setScalar(scale);
        // Center
        const center = box.getCenter(new THREE.Vector3());
        model.position.sub(center.multiplyScalar(scale));
        model.position.y = 0;
        if(onDone) onDone(model);
      },
      null,
      err => { console.error(err); if(onError) onError(err); }
    );
  }

  /* ============================================================
     UI
  ============================================================ */
  function selectCar(carKey, el) {
    selectedCar = carKey;
    document.querySelectorAll('.car-btn').forEach(b => b.classList.remove('selected'));
    el.classList.add('selected');
  }

  function startGame() {
    document.getElementById('startBtn').disabled = true;
    loadCarModel(selectedCar,
      model => {
        if (vehicleMesh) scene.remove(vehicleMesh);
        vehicleMesh = model;
        vehicleMesh.position.set(car.posX, car.posY, car.posZ);
        vehicleMesh.rotation.y = car.rotY;
        scene.add(vehicleMesh);
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('hud').style.display = 'block';
        document.getElementById('carChip').textContent = `🚗 ${CAR_NAMES[selectedCar]}`;
        document.getElementById('loadingMsg').textContent = '';
        gameRunning = true;
      },
      err => {
        const e = document.getElementById('errorMsg');
        e.style.display = 'block';
        e.textContent = `Failed to load model. Make sure models/ folder is in your repo. (${err.message||err})`;
        document.getElementById('loadingMsg').textContent = '';
        document.getElementById('startBtn').disabled = false;
      }
    );
  }

  /* ============================================================
     PHYSICS
  ============================================================ */
  function updateVehicle() {
    if (input.fwd)   car.speed = Math.min(car.speed + car.accel, car.maxSpeed);
    if (input.back)  car.speed = Math.max(car.speed - car.accel, -car.maxSpeed * 0.5);
    if (input.brake) car.speed *= 0.85;
    car.speed *= car.friction;

    if (Math.abs(car.speed) > 0.015) {
      if (input.left)  car.rotY += car.turnSpeed * Math.sign(car.speed);
      if (input.right) car.rotY -= car.turnSpeed * Math.sign(car.speed);
    }

    car.posX += Math.sin(car.rotY) * car.speed;
    car.posZ += Math.cos(car.rotY) * car.speed;

    // Soft road boundary
    if (Math.abs(car.posX) > 5.5) {
      car.posX *= 0.93;
      car.speed *= 0.88;
    }

    if (vehicleMesh) {
      vehicleMesh.position.set(car.posX, car.posY, car.posZ);
      vehicleMesh.rotation.y = car.rotY;
    }
  }

  /* ============================================================
     CAMERA
  ============================================================ */
  const _camPos = new THREE.Vector3();
  const _camLook = new THREE.Vector3();

  // Camera rotation state
  const camOrbit = {
    yaw: 0,        // horizontal offset from behind-car default (radians)
    pitch: 0.35,   // vertical angle (radians, 0=horizontal, ~0.5=high)
    dist: 16,
    isDragging: false,
    lastX: 0,
    lastY: 0,
    touchId: null  // which touch finger is orbiting
  };

  function initCameraControls() {
    const canvas = renderer.domElement;

    // Mouse
    canvas.addEventListener('mousedown', e => {
      // Only orbit if not clicking mobile buttons
      camOrbit.isDragging = true;
      camOrbit.lastX = e.clientX;
      camOrbit.lastY = e.clientY;
    });
    window.addEventListener('mousemove', e => {
      if (!camOrbit.isDragging) return;
      const dx = e.clientX - camOrbit.lastX;
      const dy = e.clientY - camOrbit.lastY;
      camOrbit.yaw   -= dx * 0.008;
      camOrbit.pitch  = Math.max(0.1, Math.min(1.1, camOrbit.pitch + dy * 0.006));
      camOrbit.lastX = e.clientX;
      camOrbit.lastY = e.clientY;
    });
    window.addEventListener('mouseup', () => { camOrbit.isDragging = false; });

    // Touch — only track touches that START on the canvas (not on buttons)
    canvas.addEventListener('touchstart', e => {
      // Use first available touch not already tracked
      for (const t of e.changedTouches) {
        // ignore touches that landed on D-pad / brake area (bottom 200px)
        if (t.clientY > innerHeight - 200) continue;
        camOrbit.isDragging = true;
        camOrbit.touchId = t.identifier;
        camOrbit.lastX = t.clientX;
        camOrbit.lastY = t.clientY;
        break;
      }
    }, { passive:true });

    window.addEventListener('touchmove', e => {
      if (!camOrbit.isDragging) return;
      for (const t of e.changedTouches) {
        if (t.identifier !== camOrbit.touchId) continue;
        const dx = t.clientX - camOrbit.lastX;
        const dy = t.clientY - camOrbit.lastY;
        camOrbit.yaw   -= dx * 0.008;
        camOrbit.pitch  = Math.max(0.1, Math.min(1.1, camOrbit.pitch + dy * 0.006));
        camOrbit.lastX = t.clientX;
        camOrbit.lastY = t.clientY;
      }
    }, { passive:true });

    window.addEventListener('touchend', e => {
      for (const t of e.changedTouches) {
        if (t.identifier === camOrbit.touchId) {
          camOrbit.isDragging = false;
          camOrbit.touchId = null;
        }
      }
    });
  }

  function updateCamera() {
    // Smoothly return yaw to 0 when not dragging (snap back behind car)
    if (!camOrbit.isDragging) {
      camOrbit.yaw *= 0.92;
    }

    const totalAngle = car.rotY + camOrbit.yaw + Math.PI;
    const px = car.posX + Math.sin(totalAngle) * camOrbit.dist * Math.cos(camOrbit.pitch);
    const py = car.posY + Math.sin(camOrbit.pitch) * camOrbit.dist;
    const pz = car.posZ + Math.cos(totalAngle) * camOrbit.dist * Math.cos(camOrbit.pitch);

    _camPos.set(px, py, pz);
    camera.position.lerp(_camPos, 0.1);
    _camLook.set(car.posX, car.posY + 1.5, car.posZ);
    camera.lookAt(_camLook);
  }

  /* ============================================================
     HUD UPDATE
  ============================================================ */
  let hudTimer = 0;
  function updateHUD(dt) {
    gameTime += dt;
    // Only update DOM every 5 frames for perf
    hudTimer++;
    if (hudTimer % 5 !== 0) return;
    const m = Math.floor(gameTime / 60);
    const s = Math.floor(gameTime % 60);
    document.getElementById('timeChip').textContent =
      `⏱ ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    document.getElementById('speedVal').textContent =
      Math.round(Math.abs(car.speed) * 200);
  }

  /* ============================================================
     GAME LOOP
  ============================================================ */
  let lastTime = 0;
  function tick(ts) {
    requestAnimationFrame(tick);
    const dt = Math.min((ts - lastTime) / 1000, 0.05);
    lastTime = ts;

    if (gameRunning) {
      updateVehicle();
      updateCamera();
      updateHUD(dt);
    }

    renderer.render(scene, camera);
  }

  /* ============================================================
     BOOT
  ============================================================ */
  initScene();
  initMobileControls();
  initCameraControls();
  requestAnimationFrame(tick);
  </script>
</body>
</html>
