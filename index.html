<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Neon Drift</title>
  <style>
    :root {
      --bg: #0a0e27;
      --panel: rgba(10,14,39,.75);
      --stroke: rgba(0,255,136,.28);
      --shadow: 0 14px 40px rgba(0,255,136,.12);
      --good: #00ff88;
      --muted: rgba(160,174,255,.85);
    }
    html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); font-family:'IBM Plex Mono',ui-monospace,monospace; color:#fff; }
    canvas { display:block; }

    /* HUD */
    #hud { position:fixed; inset:0; pointer-events:none; }
    #topbar {
      position:fixed; left:12px; top:12px;
      display:flex; gap:10px; align-items:center;
      background:var(--panel); border:1px solid var(--stroke);
      padding:10px 14px; border-radius:14px;
      backdrop-filter:blur(8px); box-shadow:var(--shadow);
      font-weight:900; letter-spacing:.5px;
    }
    .chip {
      padding:6px 12px; border-radius:999px;
      background:rgba(0,255,136,.08);
      border:1px solid rgba(0,255,136,.18);
      display:flex; gap:6px; align-items:center;
      white-space:nowrap; font-size:14px; color:var(--good);
    }
    #speedometer {
      position:fixed; left:12px; bottom:16px;
      background:var(--panel); border:1px solid var(--stroke);
      padding:16px 24px; border-radius:14px;
      backdrop-filter:blur(8px); box-shadow:var(--shadow);
      text-align:center;
    }
    #speedVal { font-size:40px; font-weight:900; color:var(--good); line-height:1; text-shadow:0 0 20px rgba(0,255,136,.5); }
    #speedUnit { font-size:12px; color:var(--muted); margin-top:4px; letter-spacing:1px; }
    #controls {
      position:fixed; right:12px; top:12px;
      background:var(--panel); border:1px solid var(--stroke);
      padding:10px 14px; border-radius:14px;
      backdrop-filter:blur(8px); box-shadow:var(--shadow);
      font-size:12px; color:var(--muted); line-height:1.7;
    }
    #controls b { color:var(--good); }
    #toast {
      position:fixed; left:50%; bottom:80px; transform:translateX(-50%);
      background:rgba(0,0,0,.55); border:1px solid var(--stroke);
      padding:10px 18px; border-radius:999px; backdrop-filter:blur(8px);
      display:none; font-weight:900; pointer-events:none;
      box-shadow:var(--shadow); color:var(--good); font-size:15px;
    }
    #vignette {
      position:fixed; inset:0; pointer-events:none;
      background:radial-gradient(ellipse at 50% 55%, rgba(0,0,0,0) 35%, rgba(0,0,0,.3) 70%, rgba(0,0,0,.5) 100%);
    }

    /* Overlay */
    #overlay {
      position:fixed; inset:0;
      display:flex; align-items:center; justify-content:center;
      background:radial-gradient(1200px 700px at 50% 35%, rgba(0,255,136,.08), rgba(0,0,0,.82));
      z-index:10;
    }
    .panel {
      width:min(480px, calc(100% - 24px));
      background:rgba(10,14,39,.92);
      border:1px solid rgba(0,255,136,.25);
      border-radius:20px; padding:32px;
      box-shadow:0 18px 60px rgba(0,0,0,.55);
      backdrop-filter:blur(12px); text-align:center;
    }
    .panel h1 { margin:0 0 6px; font-size:28px; color:var(--good); letter-spacing:2px; text-shadow:0 0 30px rgba(0,255,136,.4); }
    .panel p { margin:6px 0 20px; opacity:.75; font-size:13px; }
    .car-grid { display:flex; gap:14px; justify-content:center; margin:20px 0 24px; }
    .car-btn {
      flex:1; padding:16px 12px;
      background:rgba(0,255,136,.06);
      border:1px solid rgba(0,255,136,.25);
      color:var(--good); border-radius:14px;
      cursor:pointer; font-family:inherit;
      font-size:13px; font-weight:900;
      letter-spacing:.5px; transition:all .2s;
      line-height:1.5;
    }
    .car-btn:hover, .car-btn.selected {
      background:rgba(0,255,136,.15);
      border-color:var(--good);
      box-shadow:0 0 20px rgba(0,255,136,.25);
      transform:translateY(-2px);
    }
    .car-btn .icon { font-size:28px; display:block; margin-bottom:8px; }
    .start-btn {
      width:100%; padding:14px;
      background:rgba(0,255,136,.12);
      border:1px solid var(--good);
      color:var(--good); border-radius:12px;
      cursor:pointer; font-family:inherit;
      font-size:16px; font-weight:900;
      letter-spacing:1px; transition:all .2s;
    }
    .start-btn:hover {
      background:rgba(0,255,136,.22);
      box-shadow:0 0 30px rgba(0,255,136,.3);
    }
    #loadingMsg { color:var(--muted); font-size:13px; margin-top:14px; min-height:18px; }
    #errorMsg { color:#ff6b6b; font-size:12px; margin-top:10px; display:none; }
    .spinner {
      display:inline-block; width:24px; height:24px;
      border:2px solid rgba(0,255,136,.2);
      border-top:2px solid var(--good);
      border-radius:50%; animation:spin 1s linear infinite;
      vertical-align:middle; margin-right:8px;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>

  <!-- HUD (hidden until game starts) -->
  <div id="hud" style="display:none">
    <div id="topbar">
      <div class="chip" id="timeChip">⏱ 00:00</div>
      <div class="chip" id="carChip">🚗 —</div>
    </div>
    <div id="speedometer">
      <div id="speedVal">0</div>
      <div id="speedUnit">KM/H</div>
    </div>
    <div id="controls">
      <b>W / ↑</b> Accelerate<br>
      <b>S / ↓</b> Brake<br>
      <b>A / ←</b> Turn Left<br>
      <b>D / →</b> Turn Right<br>
      <b>Space</b> Handbrake
    </div>
    <div id="toast"></div>
    <div id="vignette"></div>
  </div>

  <!-- Menu Overlay -->
  <div id="overlay">
    <div class="panel">
      <h1>NEON DRIFT</h1>
      <p>A slow, meditative drive through neon-lit roads</p>

      <div class="car-grid">
        <div class="car-btn selected" id="btn-camaro" onclick="selectCar('camaro',this)">
          <span class="icon">🏎️</span>
          Camaro ZL1<br>
          <span style="font-size:11px;opacity:.6">2019</span>
        </div>
        <div class="car-btn" id="btn-hellcat" onclick="selectCar('hellcat',this)">
          <span class="icon">🐱</span>
          Hellcat Daytona<br>
          <span style="font-size:11px;opacity:.6">2020</span>
        </div>
      </div>

      <button class="start-btn" onclick="startGame()">START DRIVING</button>
      <div id="loadingMsg"></div>
      <div id="errorMsg"></div>
    </div>
  </div>

  <!-- Three.js from CDN (same pattern as reference) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <script>
  /* ============================================================
     GLOBALS
  ============================================================ */
  const MODEL_BASE = 'https://suprosmith-coder.github.io/nix-drift/models/';
  const MODELS = {
    camaro:  '2019_chevrolet_camaro_zl1.glb',
    hellcat: '2020_dodge_charger_srt_hellcat_daytona_50th.glb'
  };
  const CAR_NAMES = {
    camaro: 'Camaro ZL1',
    hellcat: 'Hellcat Daytona'
  };

  let selectedCar = 'camaro';
  let scene, camera, renderer;
  let vehicleMesh = null;
  let gameRunning = false;
  let gameTime = 0;

  // Vehicle state
  const car = {
    speed: 0,
    maxSpeed: 0.45,
    accel: 0.018,
    friction: 0.91,
    turnSpeed: 0.07,
    posX: 0,
    posY: 1.2,
    posZ: 0,
    rotY: 0,
  };

  // Input
  const keys = {};
  document.addEventListener('keydown', e => {
    keys[e.code] = true;
    keys[e.key.toLowerCase()] = true;
  });
  document.addEventListener('keyup', e => {
    keys[e.code] = false;
    keys[e.key.toLowerCase()] = false;
  });

  /* ============================================================
     SCENE INIT
  ============================================================ */
  function initScene() {
    // Renderer
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // Scene
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a2847);
    scene.fog = new THREE.FogExp2(0x1a2847, 0.005);

    // Camera
    camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.1, 1000);
    camera.position.set(0, 10, -18);

    // Lights
    const ambient = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambient);

    const sun = new THREE.DirectionalLight(0xffffff, 0.9);
    sun.position.set(80, 120, 60);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = sun.shadow.camera.bottom = -200;
    sun.shadow.camera.right = sun.shadow.camera.top = 200;
    sun.shadow.camera.far = 600;
    scene.add(sun);

    // Hemisphere light for sky/ground color
    const hemi = new THREE.HemisphereLight(0x223366, 0x112211, 0.6);
    scene.add(hemi);

    buildTerrain();
    buildRoad();
    buildScenery();

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  }

  /* ============================================================
     TERRAIN & ROAD
  ============================================================ */
  function buildTerrain() {
    const geo = new THREE.PlaneGeometry(600, 600, 80, 80);
    const pos = geo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), z = pos.getY(i);
      // Keep flat near road (|x| < 12), add gentle hills outside
      const distFromRoad = Math.abs(x);
      if (distFromRoad > 12) {
        pos.setZ(i, Math.sin(x * 0.04) * 3 + Math.cos(z * 0.03) * 2);
      }
    }
    geo.computeVertexNormals();

    const mat = new THREE.MeshStandardMaterial({ color: 0x2d5a3d, roughness: 0.9 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.rotation.x = -Math.PI / 2;
    mesh.receiveShadow = true;
    scene.add(mesh);
  }

  function buildRoad() {
    // Main road surface
    const roadGeo = new THREE.PlaneGeometry(12, 800);
    const roadMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.7 });
    const road = new THREE.Mesh(roadGeo, roadMat);
    road.rotation.x = -Math.PI / 2;
    road.position.set(0, 0.01, 200);
    road.receiveShadow = true;
    scene.add(road);

    // Road markings
    const markMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });
    for (let z = -400; z < 400; z += 20) {
      const markGeo = new THREE.PlaneGeometry(0.25, 8);
      const mark = new THREE.Mesh(markGeo, markMat);
      mark.rotation.x = -Math.PI / 2;
      mark.position.set(0, 0.02, z);
      scene.add(mark);
    }

    // Road edges (neon lines)
    const edgeMat = new THREE.MeshStandardMaterial({ color: 0x00ff88, emissive: 0x00ff88, emissiveIntensity: 0.6 });
    [-6, 6].forEach(x => {
      const edgeGeo = new THREE.PlaneGeometry(0.15, 800);
      const edge = new THREE.Mesh(edgeGeo, edgeMat);
      edge.rotation.x = -Math.PI / 2;
      edge.position.set(x, 0.02, 200);
      scene.add(edge);
    });
  }

  function buildScenery() {
    // Trees along both sides
    const treeMat = new THREE.MeshStandardMaterial({ color: 0x1a4a2a });
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a2a0a });

    for (let z = -300; z < 300; z += 18) {
      [-14, -18, -22, 14, 18, 22].forEach(x => {
        const jitter = (Math.random() - 0.5) * 4;
        const h = 3 + Math.random() * 4;
        const treeGeo = new THREE.ConeGeometry(1.5 + Math.random(), h, 7);
        const tree = new THREE.Mesh(treeGeo, treeMat);
        tree.position.set(x + jitter, h / 2, z + jitter);
        tree.castShadow = true;
        scene.add(tree);

        const trunkGeo = new THREE.CylinderGeometry(0.2, 0.25, 1.2, 6);
        const trunk = new THREE.Mesh(trunkGeo, trunkMat);
        trunk.position.set(x + jitter, 0.6, z + jitter);
        scene.add(trunk);
      });
    }

    // Glowing roadside poles
    const poleMat = new THREE.MeshStandardMaterial({ color: 0x333355 });
    const lightMat = new THREE.MeshStandardMaterial({ color: 0x00ccff, emissive: 0x00ccff, emissiveIntensity: 1 });
    for (let z = -200; z < 400; z += 30) {
      [-9, 9].forEach(x => {
        const poleGeo = new THREE.CylinderGeometry(0.1, 0.12, 5, 6);
        const pole = new THREE.Mesh(poleGeo, poleMat);
        pole.position.set(x, 2.5, z);
        scene.add(pole);

        const lightGeo = new THREE.SphereGeometry(0.25, 8, 8);
        const light = new THREE.Mesh(lightGeo, lightMat);
        light.position.set(x, 5.2, z);
        scene.add(light);
      });
    }

    // Stars (simple particles far away)
    const starsGeo = new THREE.BufferGeometry();
    const starsArr = [];
    for (let i = 0; i < 2000; i++) {
      starsArr.push(
        (Math.random() - 0.5) * 1000,
        60 + Math.random() * 200,
        (Math.random() - 0.5) * 1000
      );
    }
    starsGeo.setAttribute('position', new THREE.Float32BufferAttribute(starsArr, 3));
    const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.5 });
    scene.add(new THREE.Points(starsGeo, starsMat));
  }

  /* ============================================================
     MODEL LOADING
  ============================================================ */
  function loadCarModel(carKey, onDone, onError) {
    const loader = new THREE.GLTFLoader();
    const url = MODEL_BASE + MODELS[carKey];

    document.getElementById('loadingMsg').innerHTML =
      `<span class="spinner"></span>Loading ${CAR_NAMES[carKey]}...`;
    document.getElementById('errorMsg').style.display = 'none';

    loader.load(
      url,
      (gltf) => {
        const model = gltf.scene;
        model.traverse(child => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });

        // Normalize model scale
        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);
        const targetSize = 4.5;
        model.scale.setScalar(targetSize / maxDim);

        // Center model
        const center = box.getCenter(new THREE.Vector3());
        model.position.sub(center.multiplyScalar(targetSize / maxDim));
        model.position.y = 0;

        if (onDone) onDone(model);
      },
      null,
      (err) => {
        console.error('GLB load failed:', err);
        if (onError) onError(err);
      }
    );
  }

  /* ============================================================
     CAR SELECTION UI
  ============================================================ */
  function selectCar(carKey, el) {
    selectedCar = carKey;
    document.querySelectorAll('.car-btn').forEach(b => b.classList.remove('selected'));
    el.classList.add('selected');
  }

  /* ============================================================
     GAME START
  ============================================================ */
  function startGame() {
    document.querySelector('.start-btn').disabled = true;

    loadCarModel(
      selectedCar,
      (model) => {
        // Remove placeholder
        if (vehicleMesh) scene.remove(vehicleMesh);
        vehicleMesh = model;
        vehicleMesh.position.set(car.posX, car.posY, car.posZ);
        vehicleMesh.rotation.y = car.rotY;
        scene.add(vehicleMesh);

        // Show game, hide overlay
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('hud').style.display = 'block';
        document.getElementById('carChip').textContent = `🚗 ${CAR_NAMES[selectedCar]}`;

        gameRunning = true;
        document.getElementById('loadingMsg').textContent = '';
      },
      (err) => {
        const errEl = document.getElementById('errorMsg');
        errEl.style.display = 'block';
        errEl.textContent = `Failed to load model. Check that models/ folder exists in your repo. (${err.message || err})`;
        document.getElementById('loadingMsg').textContent = '';
        document.querySelector('.start-btn').disabled = false;
      }
    );
  }

  /* ============================================================
     PHYSICS UPDATE
  ============================================================ */
  function updateVehicle(dt) {
    const fwd = keys['KeyW'] || keys['w'] || keys['ArrowUp'];
    const back = keys['KeyS'] || keys['s'] || keys['ArrowDown'];
    const left = keys['KeyA'] || keys['a'] || keys['ArrowLeft'];
    const right = keys['KeyD'] || keys['d'] || keys['ArrowRight'];
    const brake = keys['Space'];

    if (fwd)  car.speed = Math.min(car.speed + car.accel, car.maxSpeed);
    if (back) car.speed = Math.max(car.speed - car.accel, -car.maxSpeed * 0.5);
    if (brake) car.speed *= 0.85;

    car.speed *= car.friction;

    if (Math.abs(car.speed) > 0.02) {
      if (left)  car.rotY += car.turnSpeed * Math.sign(car.speed);
      if (right) car.rotY -= car.turnSpeed * Math.sign(car.speed);
    }

    car.posX += Math.sin(car.rotY) * car.speed;
    car.posZ += Math.cos(car.rotY) * car.speed;

    // Keep on road (soft clamp)
    if (Math.abs(car.posX) > 5.5) {
      car.posX *= 0.92;
      car.speed *= 0.88;
    }

    if (vehicleMesh) {
      vehicleMesh.position.set(car.posX, car.posY, car.posZ);
      vehicleMesh.rotation.y = car.rotY;
    }
  }

  /* ============================================================
     CAMERA
  ============================================================ */
  const camTarget = new THREE.Vector3();
  const camPos = new THREE.Vector3();

  function updateCamera() {
    if (!vehicleMesh) return;
    const dist = 16, height = 8;
    const tx = car.posX - Math.sin(car.rotY) * dist;
    const tz = car.posZ - Math.cos(car.rotY) * dist;
    camPos.set(tx, car.posY + height, tz);
    camera.position.lerp(camPos, 0.1);
    camTarget.set(car.posX, car.posY + 2, car.posZ);
    camera.lookAt(camTarget);
  }

  /* ============================================================
     HUD
  ============================================================ */
  function updateHUD(dt) {
    if (!gameRunning) return;
    gameTime += dt;
    const m = Math.floor(gameTime / 60);
    const s = Math.floor(gameTime % 60);
    document.getElementById('timeChip').textContent =
      `⏱ ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    const kmh = Math.abs(car.speed) * 200;
    document.getElementById('speedVal').textContent = Math.round(kmh);
  }

  /* ============================================================
     GAME LOOP
  ============================================================ */
  let lastTime = 0;
  function tick(ts) {
    requestAnimationFrame(tick);
    const dt = Math.min((ts - lastTime) / 1000, 0.05);
    lastTime = ts;

    if (gameRunning) {
      updateVehicle(dt);
      updateCamera(dt);
      updateHUD(dt);
    }

    renderer.render(scene, camera);
  }

  /* ============================================================
     BOOT
  ============================================================ */
  initScene();
  requestAnimationFrame(tick);
  </script>
</body>
</html>
